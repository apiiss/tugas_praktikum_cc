<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tugas Praktikum</title>
    <style>
        body {
            background-color: #000000; /* Hitam */
            color: #c0c0c0; /* Silver */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #121212; /* Abu-abu sangat gelap */
            border: 1px solid #444; /* Abu-abu medium */
            padding: 40px 40px;
            width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            border-radius: 4px;
        }
        .logo {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 28px;
            font-weight: bold;
            color: #e0e0e0;
            margin-bottom: 35px;
            letter-spacing: 1px;
            text-align: center;
        }
        .logo span {
            font-weight: normal;
            font-size: 20px;
            color: #a8a8a8;
            display: block;
            margin-top: 5px;
        }
        .input-group {
            width: 100%;
            margin-bottom: 10px;
        }
        .input-group input {
            width: 100%;
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 12px 10px;
            font-size: 13px;
            border-radius: 4px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s ease;
        }
        .input-group input:focus {
            border-color: #a8a8a8; /* Silver focus */
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #666, #aaa); /* Silver gradient */
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #888, #ccc);
        }
        .divider {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 22px 0;
        }
        .divider .line {
            flex-grow: 1;
            height: 1px;
            background-color: #333;
        }
        .divider .text {
            margin: 0 15px;
            color: #888;
            font-size: 13px;
            font-weight: 600;
        }
        .status-text {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            line-height: 1.5;
        }
        .signup-container {
            background-color: #121212;
            border: 1px solid #444;
            padding: 20px 40px;
            width: 350px;
            text-align: center;
            margin-top: 15px;
            box-sizing: border-box;
            font-size: 14px;
            border-radius: 4px;
        }
        .signup-container a {
            color: #ccc;
            text-decoration: none;
            font-weight: bold;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            Azure Web Test
            <span>Tugas Modul 01</span>
        </div>
        
        <div class="input-group">
            <input type="text" placeholder="Username, email, or NIM" id="username">
        </div>
        <div class="input-group">
            <input type="password" placeholder="Password" id="password">
        </div>
        
        <button class="btn-login" onclick="cekStatus()">Log In</button>
        
        <div class="divider">
            <div class="line"></div>
            <div class="text">ATAU</div>
            <div class="line"></div>
        </div>
        
        <div class="status-text" id="status-message">
            Koneksi server: Menunggu aksi...
        </div>
    </div>
    
    <div class="signup-container">
        Continuous Deployment? <a href="#">Hafiz Riata</a>
    </div>
    
    <div class="footer">
        &copy; 2026 CLOUD COMPUTING - TELKOM UNIVERSITY
    </div>

    <script>
        function cekStatus() {
            const status = document.getElementById('status-message');
            status.style.color = '#fff';
            status.innerHTML = '🚀 Login Sukses!<br><span style="font-size: 12px; color: #a8a8a8;">Website berhasil ter-deploy di Microsoft Azure.</span>';
            alert("Aksi disimulasikan! Server berjalan sempurna di Azure Static Web Apps.");
        }
    </script>
</body>
</html>
